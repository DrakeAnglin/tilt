<text x="1052" y="364" font-size="12" fill="#222">RJ12 pin 1 battery + -> DRV VCC (22 AWG)</text>
<line x1="1010" y1="384" x2="1044" y2="384" stroke="#222222" stroke-width="5"/>
<text x="1052" y="388" font-size="12" fill="#222">RJ12 pin 3 GND -> DRV GND (22 AWG)</text>
<line x1="1010" y1="408" x2="1044" y2="408" stroke="#2ca02c" stroke-width="3"/>
<text x="1052" y="412" font-size="12" fill="#222">RJ12 pin 2 IN1 -> DRV IN1 (30 AWG)</text>
<line x1="1010" y1="432" x2="1044" y2="432" stroke="#e8c31a" stroke-width="3"/>
<text x="1052" y="436" font-size="12" fill="#222">RJ12 pin 6 IN2 -> DRV IN2 (30 AWG)</text>
<line x1="1010" y1="456" x2="1044" y2="456" stroke="#1f77b4" stroke-width="3"/>
<text x="1052" y="460" font-size="12" fill="#222">RJ12 pin 5 EN -> DRV ULT and AS5600 VCC (30 AWG)</text>
<line x1="1010" y1="480" x2="1044" y2="480" stroke="#555" stroke-width="5"/>
<line x1="1010" y1="480" x2="1044" y2="480" stroke="#ffffff" stroke-width="3"/>
<text x="1052" y="484" font-size="12" fill="#222">RJ12 pin 4 angle -> AS5600 OUT (30 AWG)</text>
<line x1="1010" y1="504" x2="1044" y2="504" stroke="#222222" stroke-width="3"/>
<text x="1052" y="508" font-size="12" fill="#222">RJ12 pin 3 GND -> AS5600 GND (30 AWG)</text>
<line x1="1010" y1="528" x2="1044" y2="528" stroke="#555" stroke-width="7"/>
<line x1="1010" y1="528" x2="1044" y2="528" stroke="#f2f2f2" stroke-width="5"/>
<text x="1052" y="532" font-size="12" fill="#222">DRV OUT1 / OUT2 -> N20 tabs (22 AWG)</text>
<text x="24" y="860" font-size="13" fill="#222">Grey pads stay empty: IN3, IN4, EEP, OUT3, OUT4 on the driver; SCL, SDA on the sensor. Two wires each on RJ12 pins 3 and 5.</text>
