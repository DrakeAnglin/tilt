<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="24" y="36" font-size="22" font-weight="bold">Tilter sensor module: wiring</text>
<text x="24" y="60" font-size="13" fill="#444">Match pins by the names printed on your boards (the order along each header can differ between suppliers). Thick = 22 AWG, thin = 30 AWG.</text>
<rect x="40" y="110" width="230" height="320" rx="8" fill="#2b6cb0" stroke="#333" stroke-width="1.5"/>
<text x="52" y="134" font-size="15" font-weight="bold" fill="#fff">RJ12 breakout</text>
<text x="52" y="150" font-size="11" fill="#eee">jack faces out of the module end wall</text>
<rect x="52" y="150" width="70" height="250" rx="4" fill="#ddd" stroke="#666"/>
<text x="87" y="280" font-size="12" text-anchor="middle" font-weight="bold" transform="rotate(-90 87 280)">RJ12 jack (cord)</text>
<circle cx="258" cy="160" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="164" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">1 battery +</text>
<circle cx="258" cy="206" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="210" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">2 IN1</text>
<circle cx="258" cy="252" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="256" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">3 GND</text>
<circle cx="258" cy="298" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="302" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">4 angle</text>
<circle cx="258" cy="344" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="348" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">5 EN</text>
<circle cx="258" cy="390" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="246" y="394" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">6 IN2</text>
<rect x="252" y="154" width="12" height="12" fill="none" stroke="#000" stroke-width="1.5"/>
<text x="150" y="420" font-size="11" fill="#fff">pin 1 = square pad</text>
<rect x="560" y="90" width="260" height="300" rx="8" fill="#7b2d8e" stroke="#333" stroke-width="1.5"/>
<text x="572" y="114" font-size="15" font-weight="bold" fill="#fff">DRV8833 motor driver</text>
<text x="572" y="130" font-size="11" fill="#eee">J1 en/sleep jumper must be open</text>
<circle cx="572" cy="140" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="144" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">VCC</text>
<circle cx="572" cy="186" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="190" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">GND</text>
<circle cx="572" cy="232" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="236" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">IN1</text>
<circle cx="572" cy="278" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="282" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">IN2</text>
<circle cx="572" cy="324" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="328" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">ULT</text>
<circle cx="808" cy="186" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="796" y="190" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">OUT1</text>
<circle cx="808" cy="232" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="796" y="236" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">OUT2</text>
<text x="690" y="370" font-size="11" fill="#eee" text-anchor="middle">IN3, IN4, OUT3, OUT4, EEP: leave empty</text>
<rect x="586" y="152" width="18" height="22" rx="3" fill="#7fb2e5" stroke="#2a5a8a"/>
<line x1="595" y1="140" x2="595" y2="152" stroke="#888" stroke-width="2"/><line x1="595" y1="174" x2="595" y2="186" stroke="#888" stroke-width="2"/>
<line x1="572" y1="140" x2="595" y2="140" stroke="#888" stroke-width="2"/><line x1="572" y1="186" x2="595" y2="186" stroke="#888" stroke-width="2"/>
<text x="612" y="168" font-size="11" fill="#fff" font-weight="bold">10 µF: legs on VCC and GND</text>
<rect x="560" y="450" width="260" height="250" rx="8" fill="#1d6b3a" stroke="#333" stroke-width="1.5"/>
<text x="572" y="474" font-size="15" font-weight="bold" fill="#fff">AS5600 angle sensor</text>
<text x="572" y="490" font-size="11" fill="#eee">chip faces the magnet</text>
<circle cx="572" cy="500" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="504" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">VCC</text>
<circle cx="572" cy="546" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="550" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">OUT</text>
<circle cx="572" cy="592" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="584" y="596" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">GND</text>
<circle cx="808" cy="546" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="796" y="550" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">DIR</text>
<circle cx="808" cy="500" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="796" y="504" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">GPO</text>
<circle cx="808" cy="592" r="6" fill="#e0b040" stroke="#7a5c00"/>
<text x="796" y="596" font-size="12" font-weight="bold" fill="#fff" text-anchor="end">GND</text>
<text x="690" y="680" font-size="11" fill="#eee" text-anchor="middle">SCL, SDA: leave empty</text>
<polyline points="808,500 790,500 790,522 590,522 590,500 572,500" fill="none" stroke="#1f77b4" stroke-width="3"/>
<text x="690" y="517" font-size="11" fill="#fff" text-anchor="middle">link GPO to VCC</text>
<path d="M808 546 C840 546 840 592 808 592" fill="none" stroke="#222222" stroke-width="3"/>
<text x="860" y="565" font-size="11" fill="#333">link DIR to GND (never leave DIR open:</text>
<text x="860" y="579" font-size="11" fill="#333">it sets the counting direction)</text>
<rect x="960" y="150" width="150" height="110" rx="14" fill="#bbb" stroke="#555"/>
<text x="1035" y="210" font-size="15" font-weight="bold" text-anchor="middle">N20 motor</text>
<rect x="954" y="179" width="10" height="14" fill="#e0b040" stroke="#7a5c00"/>
<rect x="954" y="225" width="10" height="14" fill="#e0b040" stroke="#7a5c00"/>
<path d="M808 186 C884 186 884 186 960 186" fill="none" stroke="#555" stroke-width="7"/>
<path d="M808 186 C884 186 884 186 960 186" fill="none" stroke="#f2f2f2" stroke-width="5"/>
<path d="M808 232 C884 232 884 232 960 232" fill="none" stroke="#555" stroke-width="7"/>
<path d="M808 232 C884 232 884 232 960 232" fill="none" stroke="#f2f2f2" stroke-width="5"/>
<text x="980" y="290" font-size="11" fill="#333">white 22 AWG pair (soldered to the</text>
<text x="980" y="304" font-size="11" fill="#333">tabs at final assembly). Swap them if</text>
<text x="980" y="318" font-size="11" fill="#333">"forward" turns the wrong way.</text>
<path d="M258 160 C375 160 375 140 572 140" fill="none" stroke="#d62728" stroke-width="5"/>
<path d="M258 252 C405 252 405 186 572 186" fill="none" stroke="#222222" stroke-width="5"/>
<path d="M258 206 C435 206 435 232 572 232" fill="none" stroke="#2ca02c" stroke-width="3"/>
<path d="M258 390 C455 390 455 278 572 278" fill="none" stroke="#e8c31a" stroke-width="3"/>
<path d="M258 344 C475 344 475 324 572 324" fill="none" stroke="#1f77b4" stroke-width="3"/>
<path d="M258 344 C425 344 425 500 572 500" fill="none" stroke="#1f77b4" stroke-width="3"/>
<path d="M258 298 C395 298 395 546 572 546" fill="none" stroke="#555" stroke-width="5"/>
<path d="M258 298 C395 298 395 546 572 546" fill="none" stroke="#ffffff" stroke-width="3"/>
<path d="M258 252 C355 252 355 592 572 592" fill="none" stroke="#222222" stroke-width="3"/>
<line x1="40" y1="470" x2="80" y2="470" stroke="#d62728" stroke-width="5"/>
<text x="90" y="474" font-size="12" fill="#222">pin 1 battery + -> DRV VCC (22 AWG)</text>
<line x1="40" y1="496" x2="80" y2="496" stroke="#222222" stroke-width="5"/>
<text x="90" y="500" font-size="12" fill="#222">pin 3 GND -> DRV GND (22 AWG)</text>
<line x1="40" y1="522" x2="80" y2="522" stroke="#2ca02c" stroke-width="3"/>
<text x="90" y="526" font-size="12" fill="#222">pin 2 IN1 -> DRV IN1</text>
<line x1="40" y1="548" x2="80" y2="548" stroke="#e8c31a" stroke-width="3"/>
<text x="90" y="552" font-size="12" fill="#222">pin 6 IN2 -> DRV IN2</text>
<line x1="40" y1="574" x2="80" y2="574" stroke="#1f77b4" stroke-width="3"/>
<text x="90" y="578" font-size="12" fill="#222">pin 5 EN -> DRV ULT and -> AS5600 VCC</text>
<line x1="40" y1="600" x2="80" y2="600" stroke="#555" stroke-width="5"/>
<line x1="40" y1="600" x2="80" y2="600" stroke="#ffffff" stroke-width="3"/>
<text x="90" y="604" font-size="12" fill="#222">pin 4 angle -> AS5600 OUT</text>
<line x1="40" y1="626" x2="80" y2="626" stroke="#222222" stroke-width="3"/>
<text x="90" y="630" font-size="12" fill="#222">pin 3 GND -> AS5600 GND (30 AWG)</text>
<line x1="40" y1="652" x2="80" y2="652" stroke="#555" stroke-width="7"/>
<line x1="40" y1="652" x2="80" y2="652" stroke="#f2f2f2" stroke-width="5"/>
<text x="90" y="656" font-size="12" fill="#222">DRV OUT1 / OUT2 -> N20 tabs</text>
<text x="24" y="735" font-size="13" fill="#222">Two separate GND wires from RJ12 pin 3 (one to the driver, one to the sensor) and two blue wires from pin 5 (EN powers the sensor and wakes the driver).</text>
</svg>