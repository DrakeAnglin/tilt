<text x="226" y="390" font-size="13" font-weight="bold" fill="#fff" text-anchor="end">6 IN2</text>
<text x="140" y="428" font-size="11" fill="#fff">pin 1 = square pad</text>
<rect x="560" y="100" width="300" height="300" rx="10" fill="#2e2a3a" stroke="#222" stroke-width="2"/>
<text x="710" y="385" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">DRV8833</text>
