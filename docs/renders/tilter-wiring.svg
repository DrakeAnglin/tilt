<path d="M790 710 L846 710 L846 746 L614 746 L614 620 L630 620" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7,4"/>
<path d="M790 602 L854 602 L854 554 L606 554 L606 692 L630 692" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7,4"/>
<text x="890" y="610" font-size="13" fill="#333">Dashed = short link wires on the BACK of the board</text>
<text x="890" y="628" font-size="13" fill="#333">(the pins are on opposite sides):</text>
<text x="890" y="652" font-size="13" fill="#1f77b4" font-weight="bold">GPO to VCC</text>
<text x="890" y="672" font-size="13" fill="#222" font-weight="bold">DIR to GND</text>
<text x="890" y="700" font-size="12" fill="#333">C1 / C2: the 3.3 V check (step 1)</text>
<rect x="1010" y="150" width="170" height="120" rx="14" fill="#bbb" stroke="#555"/>
