<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="900" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="24" y="36" font-size="22" font-weight="bold">Tilter sensor module: wiring</text>
