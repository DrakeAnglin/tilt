<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">Which way round?</text>
<line x1="40" y1="110" x2="200" y2="110" stroke="#999" stroke-width="3"/>
<rect x="90" y="96" width="60" height="28" rx="6" fill="#222"/>
<rect x="136" y="96" width="9" height="28" fill="#ddd"/>
<text x="120" y="80" font-size="14" text-anchor="middle" font-weight="bold">1N5819 / zener</text>
<text x="60" y="150" font-size="13">anode (A)</text>
<text x="150" y="150" font-size="13" font-weight="bold">band = cathode (K)</text>
<rect x="340" y="70" width="60" height="90" rx="10" fill="#1d3557"/>
<rect x="340" y="70" width="14" height="90" fill="#ddd"/>
<text x="347" y="120" font-size="16" font-weight="bold" text-anchor="middle">−</text>
<line x1="354" y1="160" x2="354" y2="200" stroke="#999" stroke-width="3"/>
<line x1="388" y1="160" x2="388" y2="215" stroke="#999" stroke-width="3"/>
<text x="370" y="60" font-size="14" text-anchor="middle" font-weight="bold">charger bulk cap</text>
<text x="300" y="235" font-size="13">stripe / short leg = −</text>
<text x="410" y="215" font-size="13">long leg = +</text>
<rect x="560" y="90" width="40" height="30" rx="5" fill="#7fb2e5"/>
<text x="580" y="80" font-size="14" text-anchor="middle" font-weight="bold">ceramic</text>
<text x="580" y="145" font-size="13" text-anchor="middle">any way round</text>
<text x="580" y="165" font-size="13" text-anchor="middle">legs 3 holes apart</text>
<rect x="700" y="96" width="70" height="26" rx="10" fill="#e8c88a"/>
<text x="735" y="80" font-size="14" text-anchor="middle" font-weight="bold">resistor</text>
<text x="735" y="145" font-size="13" text-anchor="middle">any way round</text>
</svg>