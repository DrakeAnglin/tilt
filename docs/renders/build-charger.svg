<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-size="20" font-weight="bold">Charger board (MCP73871, 30.5 × 31.5 mm): what goes where</text>
<text x="20" y="56" font-size="13" fill="#444">Front side, as in the photo. Drawn from the photo, so positions are approximate.</text>
<rect x="330" y="90" width="427" height="441" rx="10" fill="#1a1a1a"/>
<rect x="512" y="272" width="63" height="63" fill="#333" stroke="#666"/>
<text x="544" y="307" font-size="11" fill="#aaa" text-anchor="middle">MCP73871</text>
<rect x="407" y="216" width="49" height="13" fill="#c33"/>
<rect x="407" y="238" width="49" height="13" fill="#c33"/>
<rect x="407" y="261" width="49" height="13" fill="#c33"/>
<text x="462" y="237" font-size="11" fill="#bbb">status LEDs</text>
<circle cx="352" cy="196" r="9" fill="#c9a400"/><circle cx="352" cy="196" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="232" r="9" fill="#c9a400"/><circle cx="352" cy="232" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="268" r="9" fill="#c9a400"/><circle cx="352" cy="268" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="303" r="9" fill="#c9a400"/><circle cx="352" cy="303" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="339" r="9" fill="#c9a400"/><circle cx="352" cy="339" r="4" fill="#1a1a1a"/>
<rect x="644" y="133" width="53" height="70" fill="none" stroke="#fff" stroke-width="2"/>
<rect x="680" y="133" width="17" height="70" fill="#fff"/>
<text x="651" y="175" font-size="18" fill="#fff" font-weight="bold">+</text>
<circle cx="709" cy="171" r="9" fill="#c9a400"/><circle cx="709" cy="171" r="4" fill="#1a1a1a"/>
<rect x="644" y="353" width="22" height="14" fill="#555" stroke="#0a7a3a" stroke-width="3"/>
<text x="677" y="311" font-size="12" fill="#ddd" transform="rotate(90 677 311)">THERM</text>
<circle cx="389" cy="139" r="24" fill="#c9a400"/><circle cx="389" cy="139" r="12" fill="#fff"/>
<text x="389" y="109" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<circle cx="453" cy="139" r="24" fill="#c9a400"/><circle cx="453" cy="139" r="12" fill="#fff"/>
<text x="453" y="109" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">PWR</text>
<circle cx="383" cy="481" r="24" fill="#c9a400"/><circle cx="383" cy="481" r="12" fill="#fff"/>
<text x="383" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<circle cx="453" cy="481" r="24" fill="#c9a400"/><circle cx="453" cy="481" r="12" fill="#fff"/>
<text x="453" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">BATT</text>
<circle cx="621" cy="481" r="24" fill="#c9a400"/><circle cx="621" cy="481" r="12" fill="#fff"/>
<text x="621" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">LOAD</text>
<circle cx="688" cy="481" r="24" fill="#c9a400"/><circle cx="688" cy="481" r="12" fill="#fff"/>
<text x="688" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<line x1="389" y1="115" x2="389" y2="89" stroke="#222" stroke-width="3"/>
<rect x="358" y="66" width="62" height="22" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="389" y="81" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">A a21</text>
<line x1="453" y1="115" x2="453" y2="89" stroke="#d62728" stroke-width="3"/>
<rect x="422" y="66" width="62" height="22" rx="4" fill="#fff" stroke="#d62728" stroke-width="2"/>
<text x="453" y="81" font-size="12" font-weight="bold" fill="#d62728" text-anchor="middle">B e19</text>
<line x1="383" y1="505" x2="383" y2="531" stroke="#222" stroke-width="3"/>
<rect x="352" y="532" width="62" height="22" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="383" y="547" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">A a22</text>
<line x1="453" y1="505" x2="453" y2="531" stroke="#d62728" stroke-width="3"/>
<rect x="422" y="532" width="62" height="22" rx="4" fill="#fff" stroke="#d62728" stroke-width="2"/>
<text x="453" y="547" font-size="12" font-weight="bold" fill="#d62728" text-anchor="middle">B d19</text>
<line x1="621" y1="505" x2="621" y2="531" stroke="#d62728" stroke-width="3"/>
<rect x="590" y="532" width="62" height="22" rx="4" fill="#fff" stroke="#d62728" stroke-width="2"/>
<text x="621" y="547" font-size="12" font-weight="bold" fill="#d62728" text-anchor="middle">C j20</text>
<line x1="688" y1="505" x2="688" y2="531" stroke="#222" stroke-width="3"/>
<rect x="657" y="532" width="62" height="22" rx="4" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="688" y="547" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">A a23</text>
<text x="40" y="621" font-size="15" font-weight="bold">The three JST-XH plugs: crimp each wire into the position shown (each position is named after the board hole it plugs onto)</text>
<text x="60" y="651" font-size="14" font-weight="bold">Plug A: 3-pin plug</text>
<text x="60" y="669" font-size="12" fill="#444">into the angled header a21–a23</text>
<rect x="60" y="681" width="288" height="74" rx="6" fill="#f4f1e8" stroke="#777" stroke-width="2"/>
<rect x="68" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="108" y="713" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">PWR −</text>
<text x="108" y="735" font-size="12" fill="#444" text-anchor="middle">→ a21</text>
<rect x="164" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="204" y="713" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">BATT −</text>
<text x="204" y="735" font-size="12" fill="#444" text-anchor="middle">→ a22</text>
<rect x="260" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="300" y="713" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">LOAD −</text>
<text x="300" y="735" font-size="12" fill="#444" text-anchor="middle">→ a23</text>
<text x="400" y="651" font-size="14" font-weight="bold">Plug B: 2-pin plug</text>
<text x="400" y="669" font-size="12" fill="#444">into the header d19–e19</text>
<rect x="400" y="681" width="192" height="74" rx="6" fill="#f4f1e8" stroke="#777" stroke-width="2"/>
<rect x="408" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="448" y="713" font-size="14" font-weight="bold" fill="#d62728" text-anchor="middle">BATT +</text>
<text x="448" y="735" font-size="12" fill="#444" text-anchor="middle">→ d19</text>
<rect x="504" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="544" y="713" font-size="14" font-weight="bold" fill="#d62728" text-anchor="middle">PWR +</text>
<text x="544" y="735" font-size="12" fill="#444" text-anchor="middle">→ e19</text>
<text x="740" y="651" font-size="14" font-weight="bold">Plug C: 2-pin plug</text>
<text x="740" y="669" font-size="12" fill="#444">into the header j20–j21</text>
<rect x="740" y="681" width="192" height="74" rx="6" fill="#f4f1e8" stroke="#777" stroke-width="2"/>
<rect x="748" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="788" y="713" font-size="14" font-weight="bold" fill="#d62728" text-anchor="middle">LOAD +</text>
<text x="788" y="735" font-size="12" fill="#444" text-anchor="middle">→ j20</text>
<rect x="844" y="689" width="80" height="58" rx="4" fill="#fff" stroke="#bbb"/>
<text x="884" y="713" font-size="14" font-weight="bold" fill="#999" text-anchor="middle">(empty)</text>
<text x="884" y="735" font-size="12" fill="#444" text-anchor="middle">→ j21</text>
<text x="40" y="781" font-size="12" fill="#444">Before plugging in, hold each plug against its header and check every wire lands on the hole named in its position. Plug C: LOAD + can go in either position (j20 and j21 are both battery +).</text>
<line x1="670" y1="133" x2="790" y2="100" stroke="#0a7a3a" stroke-width="2"/>
<circle cx="670" cy="133" r="4" fill="#0a7a3a"/>
<text x="796" y="104" font-size="14" fill="#0a7a3a" text-anchor="start" font-weight="bold">Bulk capacitor goes here</text>
<text x="796" y="121" font-size="12" fill="#333" text-anchor="start" font-weight="normal">long leg (+) in the hole on the + side,</text>
<text x="796" y="138" font-size="12" fill="#333" text-anchor="start" font-weight="normal">stripe side to the other hole;</text>
<text x="796" y="155" font-size="12" fill="#333" text-anchor="start" font-weight="normal">bend the legs 90° first to lay it down</text>
<line x1="666" y1="360" x2="790" y2="280" stroke="#0a7a3a" stroke-width="2"/>
<circle cx="666" cy="360" r="4" fill="#0a7a3a"/>
<text x="796" y="284" font-size="14" fill="#0a7a3a" text-anchor="start" font-weight="bold">Remove this 103 (10 kΩ) resistor</text>
<text x="796" y="301" font-size="12" fill="#333" text-anchor="start" font-weight="normal">solder the 10 kΩ NTC's 2 leads to its pads</text>
<text x="796" y="318" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(check: before removing, it reads 10 kΩ)</text>
<line x1="342" y1="268" x2="300" y2="330" stroke="#666" stroke-width="2"/>
<circle cx="342" cy="268" r="4" fill="#666"/>
<text x="294" y="334" font-size="14" fill="#666" text-anchor="end" font-weight="bold">Small edge pads: leave empty</text>
<text x="294" y="351" font-size="12" fill="#333" text-anchor="end" font-weight="normal">(CE, TE, PROG2, SEL on the back)</text>
<text x="294" y="368" font-size="12" fill="#333" text-anchor="end" font-weight="normal">There is no STAT pad.</text>
</svg>