<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" font-size="20" font-weight="bold">Charger board (MCP73871, 30.5 × 31.5 mm): what goes where</text>
<text x="20" y="56" font-size="13" fill="#444">Front side, as in the photo. Drawn from the photo, so positions are approximate.</text>
<rect x="330" y="90" width="427" height="441" rx="10" fill="#1a1a1a"/>
<rect x="512" y="272" width="63" height="63" fill="#333" stroke="#666"/>
<text x="544" y="307" font-size="11" fill="#aaa" text-anchor="middle">MCP73871</text>
<rect x="407" y="216" width="49" height="13" fill="#c33"/>
<rect x="407" y="238" width="49" height="13" fill="#c33"/>
<rect x="407" y="261" width="49" height="13" fill="#c33"/>
<text x="462" y="237" font-size="11" fill="#bbb">status LEDs</text>
<circle cx="352" cy="196" r="9" fill="#c9a400"/><circle cx="352" cy="196" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="232" r="9" fill="#c9a400"/><circle cx="352" cy="232" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="268" r="9" fill="#c9a400"/><circle cx="352" cy="268" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="303" r="9" fill="#c9a400"/><circle cx="352" cy="303" r="4" fill="#1a1a1a"/>
<circle cx="352" cy="339" r="9" fill="#c9a400"/><circle cx="352" cy="339" r="4" fill="#1a1a1a"/>
<rect x="644" y="133" width="53" height="70" fill="none" stroke="#fff" stroke-width="2"/>
<rect x="680" y="133" width="17" height="70" fill="#fff"/>
<text x="651" y="175" font-size="18" fill="#fff" font-weight="bold">+</text>
<circle cx="709" cy="171" r="9" fill="#c9a400"/><circle cx="709" cy="171" r="4" fill="#1a1a1a"/>
<rect x="644" y="353" width="22" height="14" fill="#555" stroke="#0a7a3a" stroke-width="3"/>
<text x="677" y="311" font-size="12" fill="#ddd" transform="rotate(90 677 311)">THERM</text>
<circle cx="389" cy="139" r="24" fill="#c9a400"/><circle cx="389" cy="139" r="12" fill="#fff"/>
<text x="389" y="109" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<circle cx="453" cy="139" r="24" fill="#c9a400"/><circle cx="453" cy="139" r="12" fill="#fff"/>
<text x="453" y="109" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">PWR</text>
<circle cx="383" cy="481" r="24" fill="#c9a400"/><circle cx="383" cy="481" r="12" fill="#fff"/>
<text x="383" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<circle cx="453" cy="481" r="24" fill="#c9a400"/><circle cx="453" cy="481" r="12" fill="#fff"/>
<text x="453" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">BATT</text>
<circle cx="621" cy="481" r="24" fill="#c9a400"/><circle cx="621" cy="481" r="12" fill="#fff"/>
<text x="621" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">LOAD</text>
<circle cx="688" cy="481" r="24" fill="#c9a400"/><circle cx="688" cy="481" r="12" fill="#fff"/>
<text x="688" y="523" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">GND</text>
<line x1="421" y1="113" x2="300" y2="110" stroke="#b03030" stroke-width="2"/>
<circle cx="421" cy="113" r="4" fill="#b03030"/>
<text x="294" y="114" font-size="14" fill="#b03030" text-anchor="end" font-weight="bold">PWR pair: 22 AWG, 2 wires</text>
<text x="294" y="131" font-size="12" fill="#333" text-anchor="end" font-weight="normal">PWR → e19,  GND → a21</text>
<text x="294" y="148" font-size="12" fill="#333" text-anchor="end" font-weight="normal">(USB-C and solar come in here,</text>
<text x="294" y="165" font-size="12" fill="#333" text-anchor="end" font-weight="normal">through D1 / D2 on the perfboard)</text>
<line x1="418" y1="507" x2="300" y2="560" stroke="#b03030" stroke-width="2"/>
<circle cx="418" cy="507" r="4" fill="#b03030"/>
<text x="294" y="564" font-size="14" fill="#b03030" text-anchor="end" font-weight="bold">BATT pair: 22 AWG, 2 wires</text>
<text x="294" y="581" font-size="12" fill="#333" text-anchor="end" font-weight="normal">BATT → d19,  GND → a22</text>
<line x1="655" y1="507" x2="790" y2="560" stroke="#b03030" stroke-width="2"/>
<circle cx="655" cy="507" r="4" fill="#b03030"/>
<text x="796" y="564" font-size="14" fill="#b03030" text-anchor="start" font-weight="bold">LOAD pair: 22 AWG, 2 wires</text>
<text x="796" y="581" font-size="12" fill="#333" text-anchor="start" font-weight="normal">LOAD → j20,  GND → a23</text>
<line x1="670" y1="133" x2="790" y2="100" stroke="#0a7a3a" stroke-width="2"/>
<circle cx="670" cy="133" r="4" fill="#0a7a3a"/>
<text x="796" y="104" font-size="14" fill="#0a7a3a" text-anchor="start" font-weight="bold">Bulk capacitor goes here</text>
<text x="796" y="121" font-size="12" fill="#333" text-anchor="start" font-weight="normal">long leg (+) in the hole on the + side,</text>
<text x="796" y="138" font-size="12" fill="#333" text-anchor="start" font-weight="normal">stripe side to the other hole;</text>
<text x="796" y="155" font-size="12" fill="#333" text-anchor="start" font-weight="normal">bend the legs 90° first to lay it down</text>
<line x1="666" y1="360" x2="790" y2="280" stroke="#0a7a3a" stroke-width="2"/>
<circle cx="666" cy="360" r="4" fill="#0a7a3a"/>
<text x="796" y="284" font-size="14" fill="#0a7a3a" text-anchor="start" font-weight="bold">Remove this 103 (10 kΩ) resistor</text>
<text x="796" y="301" font-size="12" fill="#333" text-anchor="start" font-weight="normal">solder the 10 kΩ NTC's 2 leads to its pads</text>
<text x="796" y="318" font-size="12" fill="#333" text-anchor="start" font-weight="normal">(check: before removing, it reads 10 kΩ)</text>
<line x1="342" y1="268" x2="300" y2="330" stroke="#666" stroke-width="2"/>
<circle cx="342" cy="268" r="4" fill="#666"/>
<text x="294" y="334" font-size="14" fill="#666" text-anchor="end" font-weight="bold">Small edge pads: leave empty</text>
<text x="294" y="351" font-size="12" fill="#333" text-anchor="end" font-weight="normal">(CE, TE, PROG2, SEL on the back)</text>
<text x="294" y="368" font-size="12" fill="#333" text-anchor="end" font-weight="normal">There is no STAT pad.</text>
</svg>