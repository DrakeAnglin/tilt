<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="24" y="36" font-size="22" font-weight="bold">Multimeter: which setting for what</text>
<text x="24" y="60" font-size="13" fill="#444">Your meter may look different, but these symbols are the same on every meter.</text>

<!-- meter body -->
<rect x="40" y="90" width="300" height="520" rx="30" fill="#f2c200" stroke="#7a6000" stroke-width="3"/>
<rect x="70" y="115" width="240" height="90" rx="8" fill="#9fb59a" stroke="#333" stroke-width="2"/>
<text x="190" y="175" font-size="44" font-family="Courier New" text-anchor="middle" fill="#222">3.85</text>
<circle cx="190" cy="335" r="95" fill="#333"/>
<circle cx="190" cy="335" r="40" fill="#555"/>
<!-- knob pointer at DC V (upper-left, ~315 deg) -->
<line x1="190" y1="335" x2="133" y2="278" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
<!-- dial labels -->
<text x="100" y="250" font-size="22" font-weight="bold" fill="#d62728" text-anchor="middle">V⎓</text>
<text x="190" y="228" font-size="22" font-weight="bold" fill="#222" text-anchor="middle">V~</text>
<text x="280" y="250" font-size="22" font-weight="bold" fill="#1f77b4" text-anchor="middle">Ω</text>
<text x="300" y="345" font-size="20" font-weight="bold" fill="#2ca02c" text-anchor="middle">•)))</text>
<text x="280" y="430" font-size="18" fill="#222" text-anchor="middle">A</text>
<text x="100" y="430" font-size="18" fill="#222" text-anchor="middle">OFF</text>
<!-- sockets -->
<circle cx="110" cy="555" r="18" fill="#222"/><text x="110" y="590" font-size="13" text-anchor="middle" font-weight="bold">10A</text>
<circle cx="190" cy="555" r="18" fill="#222"/><text x="190" y="590" font-size="13" text-anchor="middle" font-weight="bold">COM</text>
<circle cx="270" cy="555" r="18" fill="#d62728"/><text x="270" y="590" font-size="13" text-anchor="middle" font-weight="bold">VΩ</text>
<path d="M190 555 C190 600 380 610 400 580" fill="none" stroke="#111" stroke-width="5"/>
<path d="M270 555 C280 600 380 560 400 540" fill="none" stroke="#d62728" stroke-width="5"/>
<text x="410" y="545" font-size="13" fill="#d62728" font-weight="bold">red lead: socket marked V Ω (not 10A)</text>
<text x="410" y="585" font-size="13" fill="#111" font-weight="bold">black lead: COM</text>

<!-- legend -->
<rect x="400" y="95" width="570" height="92" rx="8" fill="#fde8e8" stroke="#d62728" stroke-width="2"/>
<text x="420" y="128" font-size="26" font-weight="bold" fill="#d62728">V⎓</text>
<text x="480" y="122" font-size="15" font-weight="bold">DC volts (V with a straight line + dashes)</text>
<text x="480" y="142" font-size="13">Use for: battery voltage, any "should read 3.3 V / battery voltage".</text>
<text x="480" y="162" font-size="13">If your knob has numbers, pick 20 (the first one above 4.2 V).</text>
<text x="480" y="180" font-size="13" fill="#d62728" font-weight="bold">This is the one you need right now.</text>

<rect x="400" y="200" width="570" height="66" rx="8" fill="#f2f2f2" stroke="#999"/>
<text x="420" y="240" font-size="26" font-weight="bold">V~</text>
<text x="480" y="228" font-size="15" font-weight="bold">AC volts (V with a wavy line)</text>
<text x="480" y="250" font-size="13">Wall outlets only. Never for this project.</text>

<rect x="400" y="280" width="570" height="80" rx="8" fill="#e8f0fb" stroke="#1f77b4" stroke-width="2"/>
<text x="425" y="325" font-size="28" font-weight="bold" fill="#1f77b4">Ω</text>
<text x="480" y="308" font-size="15" font-weight="bold">Ohms / resistance</text>
<text x="480" y="328" font-size="13">Use for: "~0 Ω", "~1 kΩ", "OL" checks. Power must be OFF (battery out).</text>
<text x="480" y="348" font-size="13">OL = open, not connected. k = thousand, M = million.</text>

<rect x="400" y="374" width="570" height="66" rx="8" fill="#e9f6e9" stroke="#2ca02c" stroke-width="2"/>
<text x="415" y="415" font-size="22" font-weight="bold" fill="#2ca02c">•)))</text>
<text x="480" y="402" font-size="15" font-weight="bold">Continuity / beep</text>
<text x="480" y="424" font-size="13">Beeps when two points are connected. Power OFF. (Often shares the Ω spot.)</text>

<rect x="400" y="454" width="570" height="56" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="480" y="478" font-size="15" font-weight="bold">A (amps): don't use for these checks</text>
<text x="480" y="498" font-size="13">On amps the meter is a dead short: touching it across the battery can blow it.</text>
</svg>
