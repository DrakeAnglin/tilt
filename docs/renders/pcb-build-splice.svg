<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20.0" y="32.0" font-size="20.0" fill="#111" font-weight="bold" text-anchor="start">J5 splice: slots 2 and 4 joined (no change to the PCB)</text>
<text x="20.0" y="56.0" font-size="13.0" fill="#444" font-weight="normal" text-anchor="start">The battery then feeds the whole board directly; the charger only charges it.</text>
<text x="70.0" y="98.0" font-size="13.0" fill="#d62728" font-weight="bold" text-anchor="start">J5 plug: wires toward you, LOCK RAMP on the RIGHT: pin 1 is at the TOP</text>
<rect x="70" y="110" width="150" height="310" rx="6" fill="#f4f1e8" stroke="#555" stroke-width="2"/>
<rect x="75" y="115" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="133.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 1</text>
<text x="85.0" y="151.0" font-size="14.0" fill="#222" font-weight="bold" text-anchor="start">GND</text>
<rect x="75" y="165" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="183.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 2</text>
<text x="85.0" y="201.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">BATT</text>
<rect x="75" y="215" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="233.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 3</text>
<text x="85.0" y="251.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">empty</text>
<rect x="75" y="265" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="283.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 4</text>
<text x="85.0" y="301.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">BATT</text>
<rect x="75" y="315" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="333.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 5</text>
<text x="85.0" y="351.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">empty</text>
<rect x="75" y="365" width="140" height="44" rx="4" fill="#fff" stroke="#bbb"/>
<text x="85.0" y="383.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">slot 6</text>
<text x="85.0" y="401.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">PWR</text>
<rect x="221" y="132" width="26" height="266" rx="3" fill="#e3dccb" stroke="#555" stroke-width="2"/>
<text x="234.0" y="265.0" font-size="13.0" fill="#444" font-weight="bold" text-anchor="middle" transform="rotate(90 234.0 265.0)">LOCK RAMP</text>
<polygon points="62,137 44,127 44,147" fill="#d62728"/>
<text x="40.0" y="160.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="end">PIN 1</text>
<path d="M248 187 C 300 187, 310 237, 380 237" fill="none" stroke="#d62728" stroke-width="5"/>
<path d="M248 287 C 300 287, 310 237, 380 237" fill="none" stroke="#d62728" stroke-width="5"/>
<line x1="420" y1="237" x2="760" y2="237" stroke="#d62728" stroke-width="5"/>
<rect x="370" y="226" width="60" height="22" rx="8" fill="#333"/>
<text x="400.0" y="215.0" font-size="13.0" fill="#333" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">splice: soldered, heat-shrink over it</text>
<text x="770.0" y="242.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">to the 6092&#x27;s BAT pad</text>
<line x1="248" y1="137" x2="760" y2="137" stroke="#222" stroke-width="4"/>
<text x="770.0" y="142.0" font-size="14.0" fill="#222" font-weight="bold" text-anchor="start">to G</text>
<line x1="248" y1="387" x2="760" y2="387" stroke="#d62728" stroke-width="4"/>
<text x="770.0" y="392.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">to VIN</text>
<text x="40.0" y="440.0" font-size="13.0" fill="#222" font-weight="bold" text-anchor="start">Two pre-crimped JST leads (crimp ends in slots 2 and 4) and the wire to BAT, all 22 AWG, joined in one soldered splice.</text>
<text x="40.0" y="462.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Keep the two crimped legs short (about 30 mm), so the motor current&#x27;s loop through the plug is short.</text>
<text x="40.0" y="484.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">Push both crimps in until they click, then tug-test each one. A loose crimp here cuts power to the whole board.</text>
<text x="40.0" y="506.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">With the J5 plug out, the board has no power: the battery reaches it only through this plug.</text>
<text x="40.0" y="528.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Check: battery in J4, J5 plugged in, TP1 reads the battery voltage.</text>
</svg>