<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20.0" y="32.0" font-size="20.0" fill="#111" font-weight="bold" text-anchor="start">J5 splice: slots 2 and 4 joined (no change to the PCB)</text>
<text x="20.0" y="56.0" font-size="13.0" fill="#444" font-weight="normal" text-anchor="start">The battery then feeds the whole board directly; the charger only charges it.</text>
<text x="40.0" y="110.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">Charger plug: each slot named by the letter printed beside it on the board</text>
<rect x="90" y="140" width="490" height="78" rx="6" fill="#f4f1e8" stroke="#555" stroke-width="2"/>
<rect x="95" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="132.0" y="172.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">G</text>
<text x="132.0" y="196.0" font-size="12.0" fill="#222" font-weight="bold" text-anchor="middle">GND</text>
<rect x="175" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="212.0" y="172.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">B+</text>
<text x="212.0" y="196.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">BATT</text>
<rect x="255" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="292.0" y="172.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">(none)</text>
<text x="292.0" y="196.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">empty</text>
<rect x="335" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="372.0" y="172.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">L+</text>
<text x="372.0" y="196.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">BATT</text>
<rect x="415" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="452.0" y="172.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">(none)</text>
<text x="452.0" y="196.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">empty</text>
<rect x="495" y="146" width="74" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="532.0" y="172.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">P+</text>
<text x="532.0" y="196.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">PWR</text>
<path d="M212 218 C 212 278, 292 270, 292 316" fill="none" stroke="#d62728" stroke-width="5"/>
<path d="M372 218 C 372 278, 292 270, 292 316" fill="none" stroke="#d62728" stroke-width="5"/>
<line x1="292" y1="344" x2="292" y2="420" stroke="#d62728" stroke-width="5"/>
<rect x="281" y="310" width="22" height="40" rx="8" fill="#333"/>
<text x="270.0" y="335.0" font-size="13.0" fill="#333" font-weight="bold" text-anchor="end" stroke="#fff" stroke-width="3" paint-order="stroke">splice: soldered, heat-shrink over it</text>
<text x="292.0" y="440.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">to the 6092&#x27;s BAT</text>
<line x1="132" y1="218" x2="132" y2="420" stroke="#222" stroke-width="4"/>
<text x="132.0" y="440.0" font-size="14.0" fill="#222" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">to G</text>
<line x1="532" y1="218" x2="532" y2="420" stroke="#d62728" stroke-width="4"/>
<text x="532.0" y="440.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">to VIN</text>
<text x="40.0" y="480.0" font-size="13.0" fill="#222" font-weight="bold" text-anchor="start">Two pre-crimped JST leads (crimp ends in slots 2 and 4) and the wire to BAT, all 22 AWG, joined in one soldered splice.</text>
<text x="40.0" y="502.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Keep the two crimped legs short (about 30 mm), so the motor current&#x27;s loop through the plug is short.</text>
<text x="40.0" y="524.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">Push both crimps in until they click, then tug-test each one. A loose crimp here cuts power to the whole board.</text>
<text x="40.0" y="546.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">With the J5 plug out, the board has no power: the battery reaches it only through this plug.</text>
<text x="40.0" y="568.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Check: battery in J4, J5 plugged in, TP1 reads the battery voltage.</text>
</svg>