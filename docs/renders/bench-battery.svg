<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="24" y="36" font-size="22" font-weight="bold">Bench: connecting the 18650 to the breadboard</text>
<text x="24" y="60" font-size="13" fill="#444">Cell unplugged while you wire this. The plug is not keyed on bare pins: mark the red side.</text>

<!-- breadboard -->
<rect x="250" y="90" width="420" height="390" rx="10" fill="#f4f1e8" stroke="#bbb"/>
<text x="460" y="112" font-size="13" fill="#777" text-anchor="middle">breadboard</text>
<!-- GND rail -->
<rect x="270" y="430" width="380" height="24" rx="4" fill="#eee" stroke="#999"/>
<line x1="280" y1="442" x2="640" y2="442" stroke="#222" stroke-width="2" stroke-dasharray="4,4"/>
<text x="460" y="468" font-size="12" fill="#222" text-anchor="middle">GND rail (same rail as ESP GND)</text>

<!-- header pins: two rows -->
<rect x="300" y="200" width="22" height="22" fill="#222"/><rect x="300" y="240" width="22" height="22" fill="#222"/>
<rect x="306" y="206" width="10" height="10" fill="#d4af37"/><rect x="306" y="246" width="10" height="10" fill="#d4af37"/>
<circle cx="292" cy="211" r="5" fill="#d62728"/>
<text x="290" y="150" font-size="12" font-weight="bold">2 male header pins</text>
<text x="290" y="168" font-size="12" fill="#d62728" font-weight="bold">top = red side (marked)</text>
<text x="330" y="282" font-size="12" fill="#222" font-weight="bold">bottom = black side</text>


<!-- RJ12 breakout on the breadboard -->
<rect x="520" y="150" width="120" height="250" rx="6" fill="#2b6cb0"/>
<text x="580" y="172" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">RJ12 breakout</text>
<rect x="527" y="190" width="14" height="14" fill="#e0b040" stroke="#000"/>
<text x="548" y="202" font-size="12" fill="#fff" font-weight="bold">1 battery +</text>
<circle cx="534" cy="240" r="7" fill="#e0b040"/><text x="548" y="244" font-size="12" fill="#fff">2</text>
<circle cx="534" cy="275" r="7" fill="#e0b040"/><text x="548" y="279" font-size="12" fill="#fff" font-weight="bold">3 GND</text>
<circle cx="534" cy="310" r="7" fill="#e0b040"/><text x="548" y="314" font-size="12" fill="#fff">4</text>
<circle cx="534" cy="345" r="7" fill="#e0b040"/><text x="548" y="349" font-size="12" fill="#fff">5</text>
<circle cx="534" cy="380" r="7" fill="#e0b040"/><text x="548" y="384" font-size="12" fill="#fff">6</text>

<!-- jumpers -->
<path d="M322 211 L440 211 L440 197 L527 197" fill="none" stroke="#d62728" stroke-width="4"/>
<text x="400" y="230" font-size="11" fill="#d62728" text-anchor="middle">red jumper</text>
<path d="M322 251 L380 251 L380 442" fill="none" stroke="#222" stroke-width="4"/>
<path d="M534 275 L490 275 L490 442" fill="none" stroke="#222" stroke-width="4"/>
<text x="388" y="350" font-size="11" fill="#222">black jumper</text>
<text x="484" y="395" font-size="11" fill="#222" text-anchor="end">black jumper:</text><text x="484" y="409" font-size="11" fill="#222" text-anchor="end">pin 3 to GND rail</text>

<!-- the cell -->
<rect x="30" y="170" width="150" height="120" rx="12" fill="#3a8f4a" stroke="#1f5a2a"/>
<text x="105" y="225" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">18650</text>
<text x="105" y="245" font-size="12" fill="#fff" text-anchor="middle">(plug last)</text>
<rect x="200" y="196" width="40" height="70" rx="3" fill="#fff" stroke="#888"/>
<text x="220" y="285" font-size="11" text-anchor="middle">JST plug</text>
<path d="M180 210 L200 211" stroke="#d62728" stroke-width="4"/><path d="M180 252 L200 251" stroke="#222" stroke-width="4"/>
<path d="M240 211 L292 211" stroke="#d62728" stroke-width="2" stroke-dasharray="5,4"/>
<path d="M240 251 L300 251" stroke="#222" stroke-width="2" stroke-dasharray="5,4"/>
<text x="220" y="300" font-size="11" fill="#555" text-anchor="middle">pushes onto the pins</text>

<text x="24" y="500" font-size="13" fill="#222">Then check (cell unplugged): RJ12 pin 1 to red pin ~0 Ω, RJ12 pin 3 to black pin ~0 Ω, RJ12 pin 1 to pin 3 OL.</text>
</svg>
