<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1200" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20.0" y="32.0" font-size="20.0" fill="#111" font-weight="bold" text-anchor="start">Charger: Adafruit 6092 (bq25185), wired as a charger only</text>
<text x="20.0" y="56.0" font-size="13.0" fill="#444" font-weight="normal" text-anchor="start">Top view, drawn from Adafruit&#x27;s photo (not to scale). Go by the name printed beside each pad.</text>
<rect x="700" y="330" width="300" height="470" rx="16" fill="#1a1a1a" stroke="#c9c9a0" stroke-width="3"/>
<circle cx="730" cy="360" r="18" fill="#c9a400"/><circle cx="730" cy="360" r="11" fill="#fff"/>
<circle cx="970" cy="360" r="18" fill="#c9a400"/><circle cx="970" cy="360" r="11" fill="#fff"/>
<circle cx="730" cy="770" r="18" fill="#c9a400"/><circle cx="730" cy="770" r="11" fill="#fff"/>
<circle cx="970" cy="770" r="18" fill="#c9a400"/><circle cx="970" cy="770" r="11" fill="#fff"/>
<rect x="795" y="312" width="110" height="80" rx="14" fill="#c8c8c8" stroke="#777" stroke-width="2"/>
<rect x="815" y="322" width="70" height="14" rx="7" fill="#555"/>
<text x="850.0" y="300.0" font-size="13.0" fill="#333" font-weight="bold" text-anchor="middle">USB-C (top end): plug USB power in HERE</text>
<rect x="875" y="415" width="90" height="62" rx="4" fill="#f1e2c8" stroke="#a89070" stroke-width="2"/>
<text x="920.0" y="451.0" font-size="12.0" fill="#6b5a40" font-weight="bold" text-anchor="middle">JST-PH</text>
<text x="1014.0" y="442.0" font-size="12.0" fill="#666" font-weight="bold" text-anchor="start">JST-PH battery socket:</text>
<text x="1014.0" y="458.0" font-size="12.0" fill="#666" font-weight="normal" text-anchor="start">not used (the battery is on J4)</text>
<circle cx="850" cy="426" r="7" fill="#ff8c00"/>
<text x="832.0" y="431.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">C</text>
<circle cx="850" cy="450" r="7" fill="#d62728"/>
<text x="832.0" y="455.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">F</text>
<text x="1014.0" y="498.0" font-size="12.0" fill="#c06000" font-weight="bold" text-anchor="start">orange C = charging</text>
<text x="1014.0" y="514.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="start">red F = fault: unplug</text>
<rect x="850" y="560" width="40" height="40" fill="#222" stroke="#444"/>
<circle cx="728" cy="440" r="13" fill="#c9a400"/><circle cx="728" cy="440" r="6" fill="#fff"/>
<text x="750.0" y="445.0" font-size="14.0" fill="#fff" font-weight="bold" text-anchor="start">VIN</text>
<circle cx="728" cy="440" r="18" fill="none" stroke="#ffd24a" stroke-width="3"/>
<circle cx="728" cy="480" r="13" fill="#8a7a40"/><circle cx="728" cy="480" r="6" fill="#fff"/>
<text x="750.0" y="485.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">VU</text>
<circle cx="728" cy="520" r="13" fill="#8a7a40"/><circle cx="728" cy="520" r="6" fill="#fff"/>
<text x="750.0" y="525.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">D−</text>
<circle cx="728" cy="560" r="13" fill="#8a7a40"/><circle cx="728" cy="560" r="6" fill="#fff"/>
<text x="750.0" y="565.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">D+</text>
<circle cx="728" cy="600" r="13" fill="#c9a400"/><circle cx="728" cy="600" r="6" fill="#fff"/>
<text x="750.0" y="605.0" font-size="14.0" fill="#fff" font-weight="bold" text-anchor="start">G</text>
<circle cx="728" cy="600" r="18" fill="none" stroke="#ffd24a" stroke-width="3"/>
<circle cx="728" cy="640" r="13" fill="#c9a400"/><circle cx="728" cy="640" r="6" fill="#fff"/>
<text x="750.0" y="645.0" font-size="14.0" fill="#fff" font-weight="bold" text-anchor="start">BAT</text>
<circle cx="728" cy="640" r="18" fill="none" stroke="#ffd24a" stroke-width="3"/>
<circle cx="728" cy="680" r="13" fill="#8a7a40"/><circle cx="728" cy="680" r="6" fill="#fff"/>
<text x="750.0" y="685.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">3V</text>
<circle cx="728" cy="720" r="13" fill="#8a7a40"/><circle cx="728" cy="720" r="6" fill="#fff"/>
<text x="750.0" y="725.0" font-size="14.0" fill="#999" font-weight="bold" text-anchor="start">EN</text>
<text x="800.0" y="535.0" font-size="11.0" fill="#aaa" font-weight="normal" text-anchor="start">VU, D−, D+: USB-C side, empty</text>
<text x="800.0" y="705.0" font-size="11.0" fill="#aaa" font-weight="normal" text-anchor="start">3V, EN: empty</text>
<rect x="772" y="734" width="50" height="50" fill="#2e9e4f" stroke="#145a2a" stroke-width="2"/>
<circle cx="797" cy="759" r="13" fill="#c8c8c8" stroke="#777"/>
<text x="797.0" y="822.0" font-size="14.0" fill="#2e7a3f" font-weight="bold" text-anchor="middle">4.5V</text>
<rect x="826" y="734" width="50" height="50" fill="#2e9e4f" stroke="#145a2a" stroke-width="2"/>
<circle cx="851" cy="759" r="13" fill="#c8c8c8" stroke="#777"/>
<text x="851.0" y="822.0" font-size="14.0" fill="#2e7a3f" font-weight="bold" text-anchor="middle">−</text>
<rect x="880" y="734" width="50" height="50" fill="#2e9e4f" stroke="#145a2a" stroke-width="2"/>
<circle cx="905" cy="759" r="13" fill="#c8c8c8" stroke="#777"/>
<text x="905.0" y="822.0" font-size="14.0" fill="#2e7a3f" font-weight="bold" text-anchor="middle">3V</text>
<text x="850.0" y="846.0" font-size="13.0" fill="#2e7a3f" font-weight="bold" text-anchor="middle">Screw terminal (bottom end): all three stay EMPTY</text>
<text x="850.0" y="864.0" font-size="12.0" fill="#555" font-weight="normal" text-anchor="middle">(the battery feeds the board directly; see the J5 splice)</text>
<text x="40.0" y="120.0" font-size="14.0" fill="#111" font-weight="bold" text-anchor="start">Charger plug: each slot named by the letter printed beside it on the board</text>
<text x="40.0" y="140.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="start">Go by the board picture (pcb-build-plug) to put each wire in the right slot</text>
<rect x="110" y="170" width="430" height="78" rx="6" fill="#f4f1e8" stroke="#555" stroke-width="2"/>
<rect x="115" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="147.0" y="202.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">G</text>
<text x="147.0" y="226.0" font-size="12.0" fill="#222" font-weight="bold" text-anchor="middle">GND</text>
<rect x="185" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="217.0" y="202.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">B+</text>
<text x="217.0" y="226.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">BATT</text>
<rect x="255" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="287.0" y="202.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">(none)</text>
<text x="287.0" y="226.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">empty</text>
<rect x="325" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="357.0" y="202.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">L+</text>
<text x="357.0" y="226.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">BATT</text>
<rect x="395" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="427.0" y="202.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">(none)</text>
<text x="427.0" y="226.0" font-size="12.0" fill="#999" font-weight="bold" text-anchor="middle">empty</text>
<rect x="465" y="176" width="64" height="66" rx="4" fill="#fff" stroke="#bbb"/>
<text x="497.0" y="202.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">P+</text>
<text x="497.0" y="226.0" font-size="12.0" fill="#d62728" font-weight="bold" text-anchor="middle">PWR</text>
<path d="M497 248 C 497 408, 480 440, 684 440" fill="none" stroke="#d62728" stroke-width="4"/>
<path d="M147 248 C 147 408, 480 600, 684 600" fill="none" stroke="#222" stroke-width="4"/>
<path d="M217 248 C 217 308, 287 300, 287 360" fill="none" stroke="#d62728" stroke-width="4"/>
<path d="M357 248 C 357 308, 287 300, 287 360" fill="none" stroke="#d62728" stroke-width="4"/>
<path d="M287 360 C 287 480, 500 640, 684 640" fill="none" stroke="#d62728" stroke-width="4"/>
<rect x="278" y="343" width="18" height="34" rx="6" fill="#333"/>
<text x="303.0" y="365.0" font-size="12.0" fill="#333" font-weight="bold" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke">splice</text>
<text x="40.0" y="730.0" font-size="12.0" fill="#666" font-weight="normal" text-anchor="start">pins 2 and 4 both carry BATT: one splice, two crimps (11a)</text>
<text x="40.0" y="960.0" font-size="13.0" fill="#222" font-weight="bold" text-anchor="start">3 pads wired: GND (pin 1) to G, BATT (pins 2 + 4, spliced) to BAT, PWR (pin 6) to VIN. Nothing else is wired.</text>
<text x="40.0" y="984.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">No temperature probe and no big capacitor with this module (the old one needed both).</text>
<text x="40.0" y="1008.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Orange C on = charging; off = full (or its fixed 6-hour charge limit: unplug and replug power to restart).</text>
<text x="40.0" y="1032.0" font-size="13.0" fill="#222" font-weight="normal" text-anchor="start">Red F = fault: unplug and check the wiring.</text>
<text x="40.0" y="1056.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">USB plugs into this module&#x27;s USB-C. The PCB&#x27;s USB-C board and J3 are not used.</text>
<text x="40.0" y="1080.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">VIN carries solar only (J8 → D2 → J5 pin 6). The ESP can&#x27;t see USB is plugged in (GPIO0 sees solar only).</text>
<text x="40.0" y="1104.0" font-size="13.0" fill="#d62728" font-weight="normal" text-anchor="start">Do not plug in USB-C and the solar panel at the same time (not yet checked how the module joins them).</text>
</svg>