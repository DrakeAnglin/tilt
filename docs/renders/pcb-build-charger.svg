<text x="558.0" y="751.0" font-size="15.0" fill="#999" font-weight="bold" text-anchor="middle">empty</text>
<text x="558.0" y="769.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="middle"></text>
<rect x="618" y="709" width="100" height="70" rx="4" fill="#fff" stroke="#bbb"/>
<text x="668.0" y="729.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="middle">pin 6 (P+)</text>
<text x="668.0" y="751.0" font-size="15.0" fill="#d62728" font-weight="bold" text-anchor="middle">PWR</text>
<text x="668.0" y="769.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="middle">52 mm</text>
<text x="40.0" y="817.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">Lengths are the pre-crimped 152 mm JST leads cut to length (crimp end on J5, bare end on the module): one lead and a half per box.</text>
<text x="40.0" y="835.0" font-size="12.0" fill="#444" font-weight="normal" text-anchor="start">Hold the housing over J5 before plugging in: G over the silkscreen G, P+ over P+. The module&#x27;s GND pads are all one connection.</text>
</svg>