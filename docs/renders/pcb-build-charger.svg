<circle cx="670" cy="153" r="4" fill="#0a7a3a"/>
<text x="796.0" y="114.0" font-size="14.0" fill="#0a7a3a" font-weight="bold" text-anchor="start">Capacitor: LAST</text>
<text x="796.0" y="131.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">long leg (+) in the hole on the + side,</text>
<text x="796.0" y="148.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">legs bent 90° 1.5 mm from the body,</text>
<text x="796.0" y="165.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">lying over the LOAD / BATT edge,</text>
<text x="796.0" y="182.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">held 2 mm up on a spacer while soldering</text>
<line x1="666" y1="380" x2="790" y2="300" stroke="#0a7a3a" stroke-width="2"/>
<circle cx="666" cy="380" r="4" fill="#0a7a3a"/>
<text x="796.0" y="304.0" font-size="14.0" fill="#0a7a3a" font-weight="bold" text-anchor="start">THERM: remove the 103 (10 kΩ)</text>
<text x="796.0" y="321.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">solder the NTC&#x27;s own two leads (9 cm)</text>
<text x="796.0" y="338.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">one to each pad, joints sleeved;</text>
<text x="796.0" y="355.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">the NTC bead gets taped on the cell</text>
<line x1="639" y1="483" x2="790" y2="470" stroke="#d62728" stroke-width="2"/>
<circle cx="639" cy="483" r="4" fill="#d62728"/>
<text x="796.0" y="474.0" font-size="14.0" fill="#d62728" font-weight="bold" text-anchor="start">LOAD: soldered from UNDERNEATH</text>
<text x="796.0" y="491.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">wire up through the hole from the back,</text>
<text x="796.0" y="508.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">joint on top kept low (the capacitor</text>
<text x="796.0" y="525.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">lies 2.1 mm over it); wire flat under</text>
<text x="796.0" y="542.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="start">the module</text>
<line x1="342" y1="288" x2="300" y2="330" stroke="#666" stroke-width="2"/>
<circle cx="342" cy="288" r="4" fill="#666"/>
<text x="294.0" y="334.0" font-size="14.0" fill="#666" font-weight="bold" text-anchor="end">Small edge pads: leave empty</text>
<text x="294.0" y="351.0" font-size="12.0" fill="#333" font-weight="normal" text-anchor="end">(CE, TE, PROG2, SEL)</text>
<text x="40.0" y="677.0" font-size="15.0" fill="#111" font-weight="bold" text-anchor="start">J5 plug: one 6-pin JST-XH housing, 4 wires (pins 3 and 5 empty). Seen from the wire side, latch up.</text>
<rect x="60" y="701" width="676" height="86" rx="6" fill="#f4f1e8" stroke="#777" stroke-width="2"/>
<rect x="68" y="709" width="100" height="70" rx="4" fill="#fff" stroke="#bbb"/>
