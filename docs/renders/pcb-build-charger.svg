<text x="20.0" y="32.0" font-size="20.0" fill="#111" font-weight="bold" text-anchor="start">Charger module (MCP73871, 30.5 × 31.5 mm): wiring it for the PCB</text>
<text x="20.0" y="56.0" font-size="13.0" fill="#444" font-weight="normal" text-anchor="start">Front side. Drawn from the listing photo, so positions are approximate. 4 wires to J5, 2 NTC wires, the capacitor.</text>
