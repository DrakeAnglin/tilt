<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="960" font-family="Helvetica,Arial">
<rect width="100%" height="100%" fill="#fff"/>
<text x="20.0" y="34.0" font-size="20.0" fill="#111" font-weight="bold" text-anchor="start">Charger plug: which wire goes in which slot, shown on the board</text>
<text x="20.0" y="58.0" font-size="13.0" fill="#444" font-weight="normal" text-anchor="start">Looking down on the parts side, USB-C end on the right. Each wire sits next to the letter printed on the board.</text>
<rect x="60" y="110" width="672" height="648" rx="8" fill="#2f6b3a" stroke="#1d4426" stroke-width="2"/>
<rect x="393" y="328" width="124" height="415" rx="4" fill="#f2f2f2" opacity="0.25" stroke="#e9efe9" stroke-width="2"/>
<text x="376.4" y="541.0" font-size="15.0" fill="#e9efe9" font-weight="bold" text-anchor="middle" transform="rotate(-90 376.4 541.0)">CHARGER</text>
<rect x="443" y="673" width="26" height="26" rx="3" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="686" r="5" fill="#555"/>
<rect x="553" y="673" width="40" height="26" rx="4" fill="#fff"/>
<text x="573.6" y="693.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">G</text>
<line x1="595" y1="686" x2="762" y2="686" stroke="#222" stroke-width="4"/>
<text x="772.0" y="691.0" font-size="15.0" fill="#222" font-weight="bold" text-anchor="start">wire to the charger&#x27;s G</text>
<circle cx="456" cy="626" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="626" r="5" fill="#555"/>
<rect x="553" y="613" width="40" height="26" rx="4" fill="#fff"/>
<text x="573.6" y="633.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">B+</text>
<line x1="595" y1="626" x2="762" y2="626" stroke="#d62728" stroke-width="4"/>
<text x="772.0" y="631.0" font-size="15.0" fill="#d62728" font-weight="bold" text-anchor="start">BAT splice wire</text>
<circle cx="456" cy="566" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="566" r="5" fill="#555"/>
<line x1="595" y1="566" x2="762" y2="566" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
<text x="772.0" y="571.0" font-size="15.0" fill="#999" font-weight="bold" text-anchor="start">empty (no letter)</text>
<circle cx="456" cy="506" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="506" r="5" fill="#555"/>
<rect x="553" y="493" width="40" height="26" rx="4" fill="#fff"/>
<text x="573.6" y="513.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">L+</text>
<line x1="595" y1="506" x2="762" y2="506" stroke="#d62728" stroke-width="4"/>
<text x="772.0" y="511.0" font-size="15.0" fill="#d62728" font-weight="bold" text-anchor="start">BAT splice wire</text>
<circle cx="456" cy="446" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="446" r="5" fill="#555"/>
<line x1="595" y1="446" x2="762" y2="446" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
<text x="772.0" y="451.0" font-size="15.0" fill="#999" font-weight="bold" text-anchor="start">empty (no letter)</text>
<circle cx="456" cy="386" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="386" r="5" fill="#555"/>
<rect x="553" y="373" width="40" height="26" rx="4" fill="#fff"/>
<text x="573.6" y="393.0" font-size="18.0" fill="#111" font-weight="bold" text-anchor="middle">P+</text>
<line x1="595" y1="386" x2="762" y2="386" stroke="#d62728" stroke-width="4"/>
<text x="772.0" y="391.0" font-size="15.0" fill="#d62728" font-weight="bold" text-anchor="start">wire to the charger&#x27;s VIN</text>
<rect x="239" y="325" width="26" height="26" rx="3" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="252" cy="338" r="5" fill="#555"/>
<text x="367.2" y="344.0" font-size="18.0" fill="#fff" font-weight="bold" text-anchor="middle">−</text>
<circle cx="252" cy="278" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="252" cy="278" r="5" fill="#555"/>
<text x="367.2" y="284.0" font-size="18.0" fill="#fff" font-weight="bold" text-anchor="middle">+</text>
<text x="160.8" y="308.0" font-size="13.0" fill="#ffd" font-weight="bold" text-anchor="middle" transform="rotate(-90 160.8 308.0)">BATTERY plug</text>
<circle cx="456" cy="230" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="230" r="5" fill="#555"/>
<circle cx="456" cy="194" r="13" fill="#d9b44a" stroke="#8a6d1f" stroke-width="2"/>
<circle cx="456" cy="194" r="5" fill="#555"/>
<text x="372.0" y="212.0" font-size="12.0" fill="#e9efe9" font-weight="bold" text-anchor="middle" transform="rotate(-90 372.0 212.0)">SOLAR</text>
<rect x="97" y="423" width="22" height="22" fill="#d9b44a" stroke="#8a6d1f"/>
<text x="90.0" y="439.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">5V</text>
<rect x="97" y="339" width="22" height="22" fill="#d9b44a" stroke="#8a6d1f"/>
<text x="90.0" y="355.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">3V3</text>
<rect x="97" y="255" width="22" height="22" fill="#d9b44a" stroke="#8a6d1f"/>
<text x="90.0" y="271.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">PWR</text>
<rect x="97" y="171" width="22" height="22" fill="#d9b44a" stroke="#8a6d1f"/>
<text x="90.0" y="187.0" font-size="12.0" fill="#fff" font-weight="bold" text-anchor="end">GND</text>
<text x="40.0" y="830.0" font-size="14.0" fill="#222" font-weight="bold" text-anchor="start">Plug the charger plug in, look straight down, and check each wire against the letter beside it:</text>
<text x="40.0" y="856.0" font-size="14.0" fill="#222" font-weight="normal" text-anchor="start">G = the wire to the charger&#x27;s G.   B+ and L+ = the two BAT splice wires.   P+ = the wire to the charger&#x27;s VIN.</text>
<text x="40.0" y="882.0" font-size="14.0" fill="#d62728" font-weight="normal" text-anchor="start">The two slots with no letter stay empty. If a wire doesn&#x27;t sit at its letter, unplug and move it before the battery goes in.</text>
<text x="40.0" y="908.0" font-size="14.0" fill="#222" font-weight="bold" text-anchor="start">Then the beep check (meter on beep): charger G to GND, charger BAT to BAT+, charger VIN to PWR: all beep.</text>
</svg>