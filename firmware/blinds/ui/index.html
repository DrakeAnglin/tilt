<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Blinds">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme:light)"><meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme:dark)">
<title>Blinds</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--fg:#111827;--mut:#6b7280;--line:#e5e7eb;--acc:#0e7490;--accfg:#fff;--soft:#e6f6f9;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--ok:#15803d;--sun:#f59e0b;--slat:#9ca3af;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--fg:#e8edf2;--mut:#93a0ad;--line:#263040;--acc:#22d3ee;--accfg:#04222a;--soft:#10303a;--warn:#fbbf24;--warnbg:#3a2a08;--bad:#f87171;--ok:#4ade80;--sun:#fbbf24;--slat:#cbd5e1;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
body{min-height:100dvh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 6px;max-width:1040px;margin:0 auto}
h1{font-size:26px;margin:0;letter-spacing:-.02em}h2{font-size:13px;font-weight:600;color:var(--mut);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;margin:0}.sub{color:var(--mut);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:3px}.dot.off{background:var(--bad)}.dot.warn{background:var(--sun)}
main{max-width:1040px;margin:0 auto;padding:6px 14px 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.sp{flex:1}.mt{margin-top:12px}.mt2{margin-top:18px}
.muted{color:var(--mut)}.small{font-size:13px}.bad{color:var(--bad)}.okc{color:var(--ok)}.center{text-align:center}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{transform:scale(.97)}button.p{background:var(--acc);color:var(--accfg);border-color:transparent}
button.stop{background:var(--bad);color:#fff;border-color:transparent}button.ghost{background:transparent;border-color:transparent;color:var(--acc);padding:8px 10px}
button.sm{padding:7px 11px;font-size:14px;border-radius:10px}button:disabled{opacity:.45;cursor:default}button.big{padding:15px;font-size:17px;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;font-size:14px}
.seg button.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
.seg svg{width:30px;height:22px}.seg line{stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.blind{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.win{width:76px;height:104px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.win line{stroke:var(--slat);stroke-width:4.5;stroke-linecap:round}.win .glow{fill:url(#sky);transition:opacity .3s}
.state{font-size:15px;color:var(--mut);margin-top:2px}.state b{color:var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line) 49.4%,var(--mut) 49.4%,var(--mut) 50.6%,var(--line) 50.6%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12);box-shadow:0 1px 4px rgba(0,0,0,.3);margin-top:-11px}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.12)}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:-2px}
input[type=text],input[type=password],input[type=time],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.list{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);min-height:52px}.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600}.item .t .small{color:var(--mut)}.item.tap{cursor:pointer}
.sw{position:relative;width:50px;height:30px;flex:none}.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:.2s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--acc)}.sw input:checked+i:after{left:23px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 0;width:40px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
.chip.w{width:auto;padding:7px 12px}.chip.on{background:var(--acc);color:var(--accfg);border-color:transparent}
#banner{max-width:1040px;margin:0 auto;padding:0 14px}.ban{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:8px;display:flex;gap:10px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;flex:1;max-width:120px}
nav button.on{color:var(--acc)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:520px;max-height:94dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.steps{display:flex;gap:6px;margin:10px 0 16px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--acc)}
.jog{display:grid;grid-template-columns:1fr 1fr;gap:10px}.jog button{padding:22px 8px;font-size:17px;touch-action:none}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:.96}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.tile .k{font-size:11.5px;color:var(--mut)}.tile .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}.kv div:nth-child(odd){color:var(--mut)}.kv div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
canvas{width:100%;height:190px;display:block}pre{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--mut);max-height:320px;overflow:auto;margin:0}
.tabs2{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.devtag{font-size:11px;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 6px;font-weight:700}
[hidden]{display:none!important}
@media (min-width:900px){body{padding-bottom:20px;padding-left:210px}nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:26px 12px}
 nav button{flex:none;flex-direction:row;max-width:none;font-size:15px;gap:12px;padding:11px 12px;border-radius:10px}nav button.on{background:var(--soft)}
 .sheet{align-items:center}.sheet>div{border-radius:22px}#toast{bottom:30px}}
</style></head><body>
<header><div><h1 id="hName">Blinds</h1><div class="sub" id="hSub">Connecting...</div></div><div class="pill" id="batt" hidden></div></header>
<div id="banner"></div>
<main>
 <section id="v-blinds"></section>
 <section id="v-sched" hidden></section>
 <section id="v-set" hidden></section>
 <section id="v-dev" hidden></section>
</main>
<nav id="nav"></nav>
<div id="sheet" class="sheet" hidden><div id="sheetIn"></div></div>
<div id="toast"></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#fde68a"/></linearGradient></defs></svg>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="hk.js"></script>
<script src="dev.js"></script>
</body></html>
